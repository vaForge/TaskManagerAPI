<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #f5f4f0;
        --surface: #ffffff;
        --border: #e2e0d8;
        --text: #1a1a18;
        --muted: #6b6a65;
        --accent: #4f46e5;
        --accent-h: #4338ca;
        --done-fg: #9ca3af;
        --danger: #dc2626;
        --danger-h: #b91c1c;
        --green: #16a34a;
        --radius: 10px;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1a;
          --surface: #27272a;
          --border: #3f3f46;
          --text: #f4f4f5;
          --muted: #a1a1aa;
          --done-fg: #52525b;
        }
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      .container {
        max-width: 560px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 2rem;
      }
      header h1 {
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      header p {
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }

      /* Add form */
      .add-form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .add-form input {
        flex: 1;
        padding: 0.625rem 0.875rem;
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: 0.9375rem;
        outline: none;
        transition: border-color 0.15s;
      }
      .add-form input:focus {
        border-color: var(--accent);
      }
      .add-form input::placeholder {
        color: var(--muted);
      }

      .btn {
        padding: 0.625rem 1.125rem;
        border: none;
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s,
          opacity 0.15s;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-h);
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Stats bar */
      .stats {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .stats strong {
        color: var(--text);
      }

      /* Task list */
      .task-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .task-card {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        box-shadow: var(--shadow);
        transition:
          border-color 0.15s,
          opacity 0.2s;
        animation: slideIn 0.18s ease;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .task-card.done {
        opacity: 0.65;
      }

      /* Custom checkbox */
      .check-btn {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .check-btn:hover {
        border-color: var(--green);
      }
      .check-btn.checked {
        background: var(--green);
        border-color: var(--green);
      }
      .check-btn.checked::after {
        content: "";
        display: block;
        width: 5px;
        height: 9px;
        border: 2px solid #fff;
        border-top: none;
        border-left: none;
        transform: rotate(45deg) translateY(-1px);
      }

      .task-title {
        flex: 1;
        font-size: 0.9375rem;
        line-height: 1.4;
        transition:
          color 0.15s,
          text-decoration 0.15s;
      }
      .task-card.done .task-title {
        color: var(--done-fg);
        text-decoration: line-through;
      }

      .task-meta {
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }

      .del-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1;
        padding: 0.2rem 0.3rem;
        border-radius: 6px;
        transition:
          color 0.15s,
          background 0.15s;
        flex-shrink: 0;
      }
      .del-btn:hover {
        color: var(--danger);
        background: rgba(220, 38, 38, 0.08);
      }

      /* Empty / error states */
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
      }
      .empty p {
        font-size: 0.9375rem;
      }
      .empty .icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }

      .toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: var(--danger);
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-size: 0.875rem;
        opacity: 0;
        transition:
          opacity 0.2s,
          transform 0.2s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Task Manager</h1>
        <p>Simple, persistent</p>
      </header>
      <form class="add-form" id="addForm">
        <input
          type="text"
          id="titleInput"
          placeholder="Current Task"
          maxlength="200"
          autocomplete="off"
        />
        <button type="submit" class="btn btn-primary" id="addBtn">Add</button>
      </form>
      <div class="stats" id="stats"></div>
      <div class="task-list" id="taskList"></div>
    </div>
    <div class="toast" id="toast"></div>
  </body>
  <script src="script.js"></script>
</html>
